name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: test-jwt-secret-not-a-real-secret-0000000000000000
      API_KEY: test-api-key-not-a-real-secret-00000000000000000000
      CHROMA_PERSIST_DIR: /tmp/local-ai-gateway-test/chroma
      DOCUMENTS_PATH: /tmp/local-ai-gateway-test/documents
      CODE_PATH: /tmp/local-ai-gateway-test/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: python -m pytest -q
